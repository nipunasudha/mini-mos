# Local stack: Postgres + single-node Kafka (KRaft) + both services.
# Everything is demo-grade: one broker, replication factor 1, plaintext, throwaway passwords.

# Shared by ledger-api and its two one-shot jobs (migrate, seed): same image, different args.
x-ledger: &ledger
  build: services/ledger-api
  image: mini-mos/ledger-api:local
  environment:
    DATABASE_URL: postgres://app:app@postgres:5432/ledger?sslmode=disable
    KAFKA_BROKERS: kafka:9092
    ADMIN_API_ENABLED: "true"

services:
  postgres:
    image: postgres:19.0
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: ledger
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d ledger"]
      interval: 2s
      timeout: 3s
      retries: 30

  kafka:
    image: apache/kafka:4.4.0
    ports:
      - "9094:9094" # host-facing listener, for poking at topics from your laptop
    environment:
      KAFKA_NODE_ID: "1"
      # One process is both broker and controller (KRaft, no ZooKeeper).
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      # Two advertised names for the same broker: containers use kafka:9092,
      # the host uses localhost:9094. A client follows whatever the broker advertises.
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Topics are created only by topic-init, so a typo in a topic name fails loudly.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Single broker: internal topics cannot be replicated.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  # One-shot: creates the topics from spec section 6. --if-not-exists makes re-runs harmless.
  topic-init:
    image: apache/kafka:4.4.0
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    command:
      - bash
      - -c
      - |
        set -e
        t=/opt/kafka/bin/kafka-topics.sh
        $$t --bootstrap-server kafka:9092 --create --if-not-exists --topic deposits.allocated     --partitions 3 --replication-factor 1
        $$t --bootstrap-server kafka:9092 --create --if-not-exists --topic deposits.allocated.dlq --partitions 1 --replication-factor 1
        $$t --bootstrap-server kafka:9092 --create --if-not-exists --topic pots.shortfall         --partitions 3 --replication-factor 1

  ledger-migrate:
    <<: *ledger
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  ledger-seed:
    <<: *ledger
    command: ["seed"]
    depends_on:
      ledger-migrate:
        condition: service_completed_successfully
    restart: "no"

  ledger-api:
    <<: *ledger
    ports:
      - "8080:8080"
    # No container healthcheck: the image is distroless (no shell/curl). Readiness is
    # checked from outside via /readyz (see `make e2e`).
    depends_on:
      ledger-migrate:
        condition: service_completed_successfully
      ledger-seed:
        condition: service_completed_successfully
      topic-init:
        condition: service_completed_successfully

  bill-scheduler:
    build: services/bill-scheduler
    image: mini-mos/bill-scheduler:local
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_GROUP: bill-scheduler
      LEDGER_URL: http://ledger-api:8080
      DUE_HORIZON_DAYS: "7"
    ports:
      - "8081:8080"
    depends_on:
      topic-init:
        condition: service_completed_successfully
      ledger-api:
        condition: service_started
