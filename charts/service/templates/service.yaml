{{- if .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "service.selectorLabels" . | nindent 4 }}
  ports:
    # The port is named so the ServiceMonitor can refer to it by name.
    - name: http
      port: {{ .Values.port }}
      targetPort: http
{{- end }}
