# bill-scheduler's whole platform contract. CI rewrites image.tag on every merge to main.
name: bill-scheduler
image:
  repository: us-east1-docker.pkg.dev/project-819c8f08-cfa4-43ca-82a/mini-mos/bill-scheduler
  tag: "bootstrap"
replicas: 2
env:
  KAFKA_BROKERS: mos-kafka-kafka-bootstrap.mos.svc:9092
  KAFKA_GROUP: bill-scheduler
  LEDGER_URL: http://ledger-api.mos.svc:8080
  DUE_HORIZON_DAYS: "7"
networkPolicy:
  allowFrom: [] # nobody calls the scheduler; only Prometheus scrapes it
pdb:
  enabled: true
