# Prometheus Operator + Prometheus + Grafana + node-exporter + kube-state-metrics.
# Wave -2, alongside Kafka and Postgres: they don't need monitoring, so they install in
# parallel with it instead of waiting for the heaviest install. Its CRDs still exist before
# anything that uses them: mos-observability (-1) and the services' ServiceMonitors (0).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 94.1.0 # pinned: current stable at build time
    helm:
      valuesObject:
        prometheus:
          prometheusSpec:
            # By default Prometheus only selects monitors/rules labelled with this Helm
            # release. `false` makes it select ALL of them in every namespace, so a
            # service team's ServiceMonitor or PrometheusRule works with no special label.
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            # Demo cluster is destroyed daily: short retention, no PVC (a persistent
            # disk would outlive the cluster and keep billing).
            retention: 2d
            resources:
              requests:
                cpu: 200m
                memory: 600Mi
              limits:
                memory: 1500Mi # memory limit kept, no CPU limit (see decisions.md)
        grafana:
          # Grafana 12 peaks around 300 MB at startup; 256Mi got it OOMKilled in a loop.
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
        alertmanager:
          alertmanagerSpec:
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
        # GKE runs the control plane for us and does not expose etcd, scheduler or
        # controller-manager metrics; kube-proxy metrics are not reachable either
        # (and kube-proxy is absent on Dataplane V2). Left on, they create permanently-down
        # targets and firing "...Down" alerts. Their bundled rules are turned off too.
        kubeEtcd:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeControllerManager:
          enabled: false
        kubeProxy:
          enabled: false
        # GKE DNS is kube-dns, not CoreDNS, so the coreDns ServiceMonitor would find nothing.
        coreDns:
          enabled: false
        defaultRules:
          rules:
            etcd: false
            kubeSchedulerAlerting: false
            kubeSchedulerRecording: false
            kubeControllerManager: false
            kubeProxy: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The Prometheus/Alertmanager CRDs are 600-850 KB, far over the 256 KB annotation
      # limit of client-side apply.
      - ServerSideApply=true
      # Honour ignoreDifferences below during sync too, so Argo keeps the first password.
      - RespectIgnoreDifferences=true
  # No Grafana admin password is set (it must not live in a public repo), so the chart
  # generates a random one on every render. Without this, the Secret and the Deployment's
  # checksum annotation differ on every comparison: permanently OutOfSync, restarting Grafana.
  # Password: kubectl -n monitoring get secret kube-prometheus-stack-grafana -o jsonpath='{.data.admin-password}' | base64 -d
  ignoreDifferences:
    - kind: Secret
      name: kube-prometheus-stack-grafana
      jsonPointers: ["/data"]
    - group: apps
      kind: Deployment
      name: kube-prometheus-stack-grafana
      jsonPointers: ["/spec/template/metadata/annotations/checksum~1secret"]
